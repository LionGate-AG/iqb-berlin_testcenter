# Permissive CORS for local development and testing ONLY.
# Replaces the former backend/config/no-cors.htaccess.
#
# The prod image ships an EMPTY /etc/nginx/conf.d/cors.conf; the dev compose
# file mounts this file over it to enable cross-origin access during development.
add_header  Access-Control-Allow-Origin   "*"  always;
add_header  Access-Control-Allow-Headers  "*"  always;
add_header  Access-Control-Allow-Methods  "*"  always;
