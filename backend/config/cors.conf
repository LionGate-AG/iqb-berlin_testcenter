# Permissive CORS headers for development and testing only.
# The image ships an empty /etc/nginx/conf.d/cors.conf; docker-compose.dev.yml mounts this file over it.
add_header  Access-Control-Allow-Origin   "*"  always;
add_header  Access-Control-Allow-Headers  "*"  always;
add_header  Access-Control-Allow-Methods  "*"  always;
