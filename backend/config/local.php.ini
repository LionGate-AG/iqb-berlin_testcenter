upload_max_filesize = 2G
post_max_size = 2G

; Workspace file upload and delete are unbounded in cost: both re-parse EVERY
; Testtakers file in the workspace (WorkspaceDAO::updateContentTypeBasedOnRemaining-
; Testtakers, and XMLFileTesttakers::crossValidate), and XMLFileTesttakers::getAllLogins()
; is superlinear in the number of logins. Measured 2026-09-17 on tc-dev:
;
;     10,001 logins ->  2.75s        (0.28 ms/login)
;     25,001 logins -> 52.71s        (2.11 ms/login)
;     34,999 logins -> 90.70s        (2.59 ms/login)
;
; Because every existing file is re-parsed on each upload, a workspace built up to
; four 25k-login files costs roughly 4 x 52.7s = ~210s on the final upload.
;
; PHP's built-in default of 30s (no php.ini is loaded in this image -- only this
; conf.d file) was therefore the binding limit and surfaced as a dead FPM worker.
; nginx in front already allows 600s (fastcgi_read_timeout, backend/config/nginx.conf)
; and the ingress 3600s, so PHP was the smallest value in the chain.
;
; 540 keeps PHP *below* nginx's 600s so that an overrun produces a catchable PHP
; error with a stack trace rather than an nginx 504 with no diagnostic.
;
; THIS IS A MITIGATION, NOT A FIX. The real fixes are (a) have
; updateContentTypeBasedOnRemainingTesttakers() read the `logins` table instead of
; re-parsing XML, and (b) build the profile lookup once in collectProfiles() instead
; of running a `//Profiles/...` XPath per login.
max_execution_time = 540

; Deliberately BELOW the container memory limit (2Gi).
;
; At 2G they were identical, so PHP could allocate the entire container and never
; reach its own limit: the kernel OOM-killed the FPM worker first, which nginx
; reported as a bare 502 with nothing in the PHP log. Observed 2026-09-17:
;   WARNING: [pool www] child 21291 exited on signal 9 (SIGKILL)
;   -> POST /api/workspace/1/file  502
;
; At 1536M PHP hits its own ceiling first and raises "Allowed memory size exhausted"
; -- a catchable fatal naming the file and line. The container also hosts nginx, the
; FPM master and the other workers, so leaving headroom is correct regardless.
;
; Measured peak for a single 25,001-login file is 98.5 MB, so this is ample; the
; ceiling exists to make failure diagnosable, not because the work needs 1.5 GB.
memory_limit = 1536M

display_errors = on
display_startup_errors = on
error_reporting = E_ALL & ~E_NOTICE & ~E_WARNING
expose_php = Off
max_file_uploads = 200

opcache.memory_consumption=128
opcache.interned_strings_buffer=8
; phpdocument default opcache.max_accelerated_files=4000
opcache.max_accelerated_files=10000
; phpdocumetn default opcache.revalidate_freq=60
opcache.revalidate_freq=2
opcache.validate_timestamps=1
opcache.max_file_size=2M
opcache.enable_cli=1
opcache.enable=1
