; PHP-FPM overrides for the testcenter backend.
; Loaded after the image defaults (www.conf, zz-docker.conf) because of the
; "zz-" filename, so these values win. Copied to php-fpm.d/zz-testcenter.conf.

[global]
; Send the master/error log to the container's stderr so `docker logs` works.
error_log = /proc/self/fd/2
daemonize = no

[www]
; nginx talks to fpm over loopback inside the same container.
listen = 127.0.0.1:9000

; Process-manager sizing. The stock php:8.3-fpm www.conf ships pm.max_children=5,
; which caps each pod at 5 concurrent PHP requests. Under load that saturates the
; FPM listen queue, so even the liveness/readiness probes (/version, /system/status)
; time out -> kubelet restarts the pod -> cascading restarts. With a 1Gi pod limit
; and typical per-request usage well under 100MB (measured ~1-1.5MB/worker RSS at
; load), 120 workers was the next bump past 60. 120 x 10 replicas = 1200
; worst-case DB connections -- verify this stays within headroom given ProxySQL
; connection pooling in front of MySQL (see run-server.sh) before relying on it
; under real load. CPU was the limiting factor at 60 workers (~440m for 40 busy
; workers on a 2-core pod); re-measure CPU headroom at 120 before trusting it.
; NOTE 1: keep `limit_conn fpm <N>` in nginx.conf in sync with this value.
; NOTE 2: php-fpm does not interpolate env vars in these directives, so this is a
; literal value; change it here and rebuild the image to retune.
pm = dynamic
pm.max_children = 120
pm.start_servers = 15
pm.min_spare_servers = 12
pm.max_spare_servers = 30
; Recycle workers periodically to bound memory growth / leaks under sustained load.
pm.max_requests = 500

; CRITICAL for the fpm migration: under Apache mod_php the app inherited the
; container environment automatically. fpm clears it by default, which would
; hide MYSQL_*/REDIS_*/OVERRIDE_CONFIG etc. from getenv(). Keep it available.
clear_env = no

; Surface worker stdout/stderr (uncaught errors, error_log) on the container log.
catch_workers_output = yes
decorate_workers_output = no

; Access logging is handled at the proxy layer; keep fpm quiet.
access.log = /dev/null
