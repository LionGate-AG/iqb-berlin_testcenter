; PHP-FPM settings for the testcenter backend.
; Copied to php-fpm.d/zz-testcenter.conf, so it loads after the image defaults
; (www.conf, zz-docker.conf) and its values win.

[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
; nginx in the same container talks to PHP-FPM over loopback.
listen = 127.0.0.1:9000

; Active, idle and total worker counts, readable over FastCGI on 127.0.0.1:9000
; (not routed through nginx). Used by monitoring to see worker saturation.
pm.status_path = /status

; Worker pool. The image default (pm.max_children = 5) lets a handful of slow
; requests block the whole backend. Each worker is one OS process, so size
; pm.max_children by memory: (memory available to the container - ~100 MB for
; nginx and the FPM master) / memory per worker (see the documentation page
; "Scaling: PHP-FPM"). Stay well below the pod's PID limit in Kubernetes.
;
; Keep `limit_conn fpm <N>` in nginx.conf equal to pm.max_children.
pm = dynamic
pm.max_children = 300
pm.start_servers = 15
pm.min_spare_servers = 12
pm.max_spare_servers = 30
; Recycle workers periodically to bound memory growth.
pm.max_requests = 500

; The application reads its configuration from environment variables
; (SystemConfig::readEnvironment()). PHP-FPM clears the environment by default.
clear_env = no

; Uncaught errors and error_log() output go to the container log.
catch_workers_output = yes
decorate_workers_output = no

access.log = /dev/null
