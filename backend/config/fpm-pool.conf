; PHP-FPM overrides for the testcenter backend.
; Loaded after the image defaults (www.conf, zz-docker.conf) because of the
; "zz-" filename, so these values win. Copied to php-fpm.d/zz-testcenter.conf.

[global]
; Send the master/error log to the container's stderr so `docker logs` works.
error_log = /proc/self/fd/2
daemonize = no

[www]
; nginx talks to fpm over loopback inside the same container.
listen = 127.0.0.1:9000

; CRITICAL for the fpm migration: under Apache mod_php the app inherited the
; container environment automatically. fpm clears it by default, which would
; hide MYSQL_*/REDIS_*/OVERRIDE_CONFIG etc. from getenv(). Keep it available.
clear_env = no

; Surface worker stdout/stderr (uncaught errors, error_log) on the container log.
catch_workers_output = yes
decorate_workers_output = no

; Access logging is handled at the proxy layer; keep fpm quiet.
access.log = /dev/null
