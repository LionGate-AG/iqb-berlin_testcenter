; PHP-FPM overrides for the testcenter backend.
; Loaded after the image defaults (www.conf, zz-docker.conf) because of the
; "zz-" filename, so these values win. Copied to php-fpm.d/zz-testcenter.conf.

[global]
; Send the master/error log to the container's stderr so `docker logs` works.
error_log = /proc/self/fd/2
daemonize = no

[www]
; nginx talks to fpm over loopback inside the same container.
listen = 127.0.0.1:9000

; Exposes active/idle/total worker counts for the php-fpm_exporter sidecar
; (scrapes via FastCGI directly against 127.0.0.1:9000, not through nginx --
; see the infra chart's backend Deployment). Feeds a second HPA metric so
; scale-up can see real FPM saturation directly, instead of only inferring it
; from CPU -- which goes blind once nginx's `limit_conn` starts shedding
; requests before they ever reach a worker (see pm.max_children comment above).
pm.status_path = /status

; Process-manager sizing. Stock php:8.3-fpm ships pm.max_children=5, which under
; load saturates the FPM listen queue, timing out even the health probes and
; triggering cascading restarts. Bumped 5 -> 24 -> 40 -> 60 -> 120 -> 300.
;
; 120 became the binding constraint itself: a load test hit this cap (matched by
; `limit_conn fpm <N>` in nginx.conf) while CPU sat at only ~14% of its request --
; invisible to the CPU-based HPA, which never scaled. A first attempt raised it to
; 1000, but that many OS processes (plus nginx's and FPM's own) risks Kubernetes'
; pod PID-limit default (~1024), failing as fork errors instead of degrading
; cleanly. Settled on 300, safely under that ceiling; capacity beyond one pod now
; comes from the HPA adding more, smaller replicas (see
; deployment.backend.autoscaling.maxReplicas in the infra chart).
;
; Sizing math (~3.5m CPU/connection, measured at 120): the pod's CPU request/limit
; (700m/1500m, infra chart) puts the HPA's 70% scale-up trigger around ~140
; connections -- under half the 300 cap, leaving margin for new replicas to arrive
; before any pod's local cap binds. This is one data point, not validated --
; re-measure under real load, and watch ProxySQL's maxClientConnections (4096) if
; maxReplicas (30) x 300 gets close to being real concurrent traffic.
;
; NOTE 1: keep `limit_conn fpm <N>` in nginx.conf in sync with this value.
; NOTE 2: literal value, not env-substituted -- change here and rebuild the image.
pm = dynamic
pm.max_children = 300
pm.start_servers = 15
pm.min_spare_servers = 12
pm.max_spare_servers = 30
; Recycle workers periodically to bound memory growth / leaks under sustained load.
pm.max_requests = 500

; CRITICAL for the fpm migration: under Apache mod_php the app inherited the
; container environment automatically. fpm clears it by default, which would
; hide MYSQL_*/REDIS_*/OVERRIDE_CONFIG etc. from getenv(). Keep it available.
clear_env = no

; Surface worker stdout/stderr (uncaught errors, error_log) on the container log.
catch_workers_output = yes
decorate_workers_output = no

; Access logging is handled at the proxy layer; keep fpm quiet.
access.log = /dev/null
