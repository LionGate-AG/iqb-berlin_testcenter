# nginx configuration for the testcenter backend (php-fpm).
# Replaces the former Apache (mod_php) setup. The container runs rootless
# (www-data / uid 33), so pid, logs and temp paths live in writable locations.

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Rootless-friendly temp paths (must be writable by www-data)
  client_body_temp_path  /tmp/nginx-client-body;
  proxy_temp_path        /tmp/nginx-proxy;
  fastcgi_temp_path      /tmp/nginx-fastcgi;
  uwsgi_temp_path        /tmp/nginx-uwsgi;
  scgi_temp_path         /tmp/nginx-scgi;

  access_log     off;
  sendfile       on;
  server_tokens  off;

  # Mirror the former Apache/PHP limits (local.php.ini: 2G uploads)
  client_max_body_size  2G;
  fastcgi_read_timeout  600s;
  fastcgi_send_timeout  600s;

  # gzip is intentionally OFF. The /speed-test endpoint must transfer
  # uncompressed bytes so the frontend can measure real network throughput.
  # This replaces the former apache_setenv('no-gzip', '1') call that lived in
  # SpeedtestController under mod_php (that function does not exist under fpm).
  gzip off;

  # The browser caches 410 responses, which would permanently lock out
  # re-activated accounts. Emit a no-store Cache-Control header on 410 only.
  # (nginx omits the header entirely when the mapped value is empty.)
  map $status $tc_cache_control {
    410      "max-age=0, no-cache, no-store, must-revalidate";
    default  "";
  }

  # Per-pod backpressure: cap concurrent requests to php-fpm at the worker count
  # (pm.max_children). When the pod is saturated, the next request gets an instant
  # 503 instead of queuing for tens of seconds. Keep `limit_conn fpm <N>` (in
  # location / below) in sync with pm.max_children (currently 300 -- see
  # fpm-pool.conf: raised from 120 because it was capping capacity below what CPU
  # could handle, but kept well under 1000 to stay clear of Kubernetes' pod PID
  # limit; capacity beyond one pod now comes from the HPA adding more replicas).
  limit_conn_zone   $server_name  zone=fpm:10m;
  limit_conn_status 503;

  server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /var/www/testcenter/backend;

    # Was: Header add Access-Control-Expose-Headers ... in backend/.htaccess
    add_header  Access-Control-Expose-Headers  "SubscribeToken, Error-ID, Test-Mode"  always;
    add_header  Cache-Control                  $tc_cache_control                       always;

    # Permissive CORS for dev/test. Empty in the prod image; the dev compose
    # file mounts backend/config/cors.conf over it. Replaces no-cors.htaccess.
    include  /etc/nginx/conf.d/cors.conf;

    # Health endpoint served directly by nginx -- NOT proxied to php-fpm and NOT
    # rate-limited (no limit_conn), so it always answers instantly while nginx is
    # alive. BOTH liveness and readiness use this: under load the backend's fpm
    # pool fills and /version (/system/status) start returning limit_conn 503s or
    # timing out -> with FPM-backed probes that made pods flap NotReady + restart,
    # collapsing capacity to a few pods. With /healthz, all pods stay Ready and in
    # rotation; overflow is shed as fast limit_conn 503s on location / (spread
    # across all pods) instead of a capacity collapse. startupProbe still uses
    # /version (fpm) so a pod only joins the Service once fpm is actually serving.
    location = /healthz {
      access_log  off;
      return      200 "ok\n";
    }

    # Front controller: every request is handled by index.php (Slim), exactly
    # like the former mod_rewrite rule. Because nothing is served from disk,
    # source code, vendor/ and config/ are never exposed directly.
    location / {
      # Backpressure: admit at most pm.max_children (300) concurrent requests to
      # fpm; the next gets an immediate 503 rather than waiting for a worker.
      limit_conn    fpm 300;

      include       fastcgi_params;
      fastcgi_pass  127.0.0.1:9000;

      # Always route to the single front controller.
      fastcgi_param  SCRIPT_FILENAME  $document_root/index.php;
      fastcgi_param  SCRIPT_NAME      /index.php;
      fastcgi_param  PATH_INFO        "";
    }
  }
}
