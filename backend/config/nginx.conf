# nginx in front of PHP-FPM for the testcenter backend.
# The container runs as www-data, so pid and temp paths live in /tmp.

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  client_body_temp_path  /tmp/nginx-client-body;
  proxy_temp_path        /tmp/nginx-proxy;
  fastcgi_temp_path      /tmp/nginx-fastcgi;
  uwsgi_temp_path        /tmp/nginx-uwsgi;
  scgi_temp_path         /tmp/nginx-scgi;

  access_log     off;
  sendfile       on;
  server_tokens  off;

  # Matches upload_max_filesize / post_max_size in local.php.ini.
  client_max_body_size  2G;
  fastcgi_read_timeout  600s;
  fastcgi_send_timeout  600s;

  gzip          on;
  gzip_proxied  any;
  gzip_vary     on;
  gzip_types    text/plain text/xml text/css text/javascript application/javascript application/xml;

  # Browsers cache 410 responses, which would lock out re-activated accounts for good.
  # nginx omits the header when the mapped value is empty.
  map $status $tc_cache_control {
    410      "max-age=0, no-cache, no-store, must-revalidate";
    default  "";
  }

  # Admission control: at most pm.max_children (fpm-pool.conf) requests are passed to PHP-FPM at a
  # time. Further requests get an immediate 503 instead of waiting in FPM's listen queue until they
  # time out. Keep `limit_conn fpm <N>` below equal to pm.max_children.
  limit_conn_zone    $server_name  zone=fpm:10m;
  limit_conn_status  503;

  server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /var/www/testcenter/backend;

    add_header  Access-Control-Expose-Headers  "SubscribeToken, Error-ID, Test-Mode"  always;
    add_header  Cache-Control                  $tc_cache_control                       always;

    # Permissive CORS headers in development; empty in the image.
    include  /etc/nginx/conf.d/cors.conf;

    # Every request goes to the front controller index.php (Slim). Nothing is served from disk, so
    # src/, vendor/ and config/ are never exposed.
    include        fastcgi_params;
    fastcgi_param  SCRIPT_FILENAME  $document_root/index.php;
    fastcgi_param  SCRIPT_NAME      /index.php;
    fastcgi_param  PATH_INFO        "";

    # Answered by nginx itself, without a PHP-FPM worker and outside the admission limit, so it
    # reports whether the pod is alive even when all workers are busy.
    location = /healthz {
      access_log  off;
      default_type  text/plain;
      return      200 "ok\n";
    }

    location / {
      limit_conn    fpm 300;
      fastcgi_pass  127.0.0.1:9000;
    }

    # The speed test measures the network throughput, so its payload must not be compressed.
    location ^~ /speed-test/ {
      gzip          off;
      limit_conn    fpm 300;
      fastcgi_pass  127.0.0.1:9000;
    }
  }
}
