# Base compose file defining services and their settings
# For concrete images check the environment specific override files.

x-restart-policy: &restart-policy
  restart: "${RESTART_POLICY:-always}"

x-env-redis: &env-redis
  REDIS_HOST: cache-server
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_CACHE_FILES: ${REDIS_CACHE_FILES:-false}

x-env-db: &env-db
  DB_DATABASE: ${DB_DATABASE}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

# configuration the backend code reads, shared by the backend and the test-log drainer
x-env-backend: &env-backend
  BROADCASTER_ENABLED: ${BROADCASTER_ENABLED}
  FILE_SERVER_ENABLED: ${FILE_SERVER_ENABLED}
  BRUTE_FORCE_PROTECTION: ${BRUTE_FORCE_PROTECTION:-}
  SERVER_KEY: ${SERVER_KEY}
  XML_SCHEMA_VALIDATION: ${XML_SCHEMA_VALIDATION:-}
  <<: [ *env-redis, *env-db ]
  DB_HOST: db
  DB_PORT: 5432
  PASSWORD_SALT: ${PASSWORD_SALT}
  PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH}
  PASSWORD_PATTERN: ${PASSWORD_PATTERN}
  REQUIRE_LOGIN_PASSWORD: ${REQUIRE_LOGIN_PASSWORD:-false}
  ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD}
  TESTCENTER_CACHE_AUTH_TOKEN: ${TESTCENTER_CACHE_AUTH_TOKEN:-false}
  TESTCENTER_AUTH_TOKEN_TTL: ${TESTCENTER_AUTH_TOKEN_TTL:-}
  TESTCENTER_ASYNC_TEST_LOGS: ${TESTCENTER_ASYNC_TEST_LOGS:-false}
  TESTCENTER_BUFFER_TEST_STATE: ${TESTCENTER_BUFFER_TEST_STATE:-false}

x-env-logging-conf: &env-logging-conf
  max-size: "200m"
  max-file: "10"

services:
  traefik:
    image: ${DOCKERHUB_PROXY}traefik:v3.6
    <<: *restart-policy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      testcenter:

  broadcaster:
    image: iqbberlin/testcenter-broadcaster:current
    <<: *restart-policy
    logging:
      options:
        <<: *env-logging-conf
    networks:
      testcenter:

  frontend:
    image: iqbberlin/testcenter-frontend:current
    <<: *restart-policy
    depends_on:
      backend:
        condition: service_healthy
    logging:
      options:
        <<: *env-logging-conf
    networks:
      testcenter:


  file-server:
    image: iqbberlin/testcenter-file-server:current
    <<: *restart-policy
    depends_on:
      - cache-server
    environment:
      <<: *env-redis
    volumes_from:
      - backend:ro
    networks:
      testcenter:

  backend:
    image: iqbberlin/testcenter-backend:current
    <<: *restart-policy
    depends_on:
      db:
        condition: service_healthy
      cache-server:
        condition: service_started
    environment:
      <<: *env-backend
    logging:
      options:
        <<: *env-logging-conf
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://backend:8080/version" ]
      start_period: 600s
      start_interval: 5s
      interval: 90s
      timeout: 30s
      retries: 3
    volumes:
      - backend_vol:/var/www/testcenter/data
      - /var/www/testcenter/data/.schemas
    networks:
      testcenter:

  # Writes the test logs the backend queues in the cache server to the database (TESTCENTER_ASYNC_TEST_LOGS). It runs
  # whatever that switch says, so that rows queued before switching it off still arrive. Exactly one instance.
  log-drainer:
    image: iqbberlin/testcenter-backend:current
    <<: *restart-policy
    depends_on:
      db:
        condition: service_healthy
      cache-server:
        condition: service_started
    entrypoint: [ "php", "/var/www/testcenter/backend/drain-logs.php" ]
    environment:
      <<: *env-backend
      LOG_DRAIN_BATCH: ${LOG_DRAIN_BATCH:-}
      LOG_DRAIN_IDLE_MS: ${LOG_DRAIN_IDLE_MS:-}
      LOG_DRAIN_REPORT_SEC: ${LOG_DRAIN_REPORT_SEC:-}
    logging:
      options:
        <<: *env-logging-conf
    networks:
      testcenter:

  # Writes the test states the backend buffers in the cache server to the database (TESTCENTER_BUFFER_TEST_STATE). It
  # runs whatever that switch says, so that states buffered before switching it off still arrive. Exactly one instance.
  state-drainer:
    image: iqbberlin/testcenter-backend:current
    <<: *restart-policy
    depends_on:
      db:
        condition: service_healthy
      cache-server:
        condition: service_started
    entrypoint: [ "php", "/var/www/testcenter/backend/drain-test-states.php" ]
    environment:
      <<: *env-backend
      STATE_DRAIN_INTERVAL_MS: ${STATE_DRAIN_INTERVAL_MS:-}
      STATE_DRAIN_BATCH: ${STATE_DRAIN_BATCH:-}
      STATE_DRAIN_REPORT_SEC: ${STATE_DRAIN_REPORT_SEC:-}
    logging:
      options:
        <<: *env-logging-conf
    networks:
      testcenter:

  cache-server:
    image: ${DOCKERHUB_PROXY}redis:8.0-bookworm
    <<: *restart-policy
    user: redis
    # volatile-lru evicts only keys with an expiry. The queues of the log and state drainers have none and rely on
    # never being evicted.
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD}",
      "--maxmemory", "${REDIS_MEMORY_MAX:-1gb}",
      "--maxmemory-policy", "volatile-lru",
      "--save", '""',
      "--appendonly", "no"
    ]
    networks:
      testcenter:

  db:
    image: ${DOCKERHUB_PROXY}postgres:18.4
    <<: *restart-policy
    environment:
      # POSTGRES_* is the fixed interface of the official image. DB_* remains the only public configuration.
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_vol:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_DATABASE}", "-h", "127.0.0.1" ]
      start_period: 120s
      start_interval: 5s
      interval: 90s
      timeout: 30s
      retries: 3
    networks:
      testcenter:

volumes:
  postgres_vol:
  backend_vol:

networks:
  testcenter:
    name: ${COMPOSE_PROJECT_NAME}
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: ${DOCKER_DAEMON_MTU:-1500}
