# Base compose file defining services and their settings
# For concrete images check the environment specific override files.

x-restart-policy: &restart-policy
  restart: "${RESTART_POLICY:-always}"

x-env-redis: &env-redis
  REDIS_HOST: cache-server
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_CACHE_FILES: ${REDIS_CACHE_FILES:-false}

x-env-db: &env-db
  DB_DATABASE: ${DB_DATABASE}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

x-env-logging-conf: &env-logging-conf
  max-size: "200m"
  max-file: "10"

services:
  traefik:
    image: ${DOCKERHUB_PROXY}traefik:v3.6
    <<: *restart-policy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      testcenter:

  broadcaster:
    image: iqbberlin/testcenter-broadcaster:current
    <<: *restart-policy
    depends_on:
      - broadcaster-redis
    environment:
      REDIS_HOST: broadcaster-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging:
      options:
        <<: *env-logging-conf
    networks:
      testcenter:

  # Shared state and pub/sub of the broadcaster. Separate from cache-server: its data must not be evicted.
  broadcaster-redis:
    image: ${DOCKERHUB_PROXY}redis:8.0-bookworm
    <<: *restart-policy
    user: redis
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD}",
      "--maxmemory-policy", "noeviction",
      "--save", '""',
      "--appendonly", "no"
    ]
    networks:
      testcenter:

  frontend:
    image: iqbberlin/testcenter-frontend:current
    <<: *restart-policy
    depends_on:
      backend:
        condition: service_healthy
    logging:
      options:
        <<: *env-logging-conf
    networks:
      testcenter:


  file-server:
    image: iqbberlin/testcenter-file-server:current
    <<: *restart-policy
    depends_on:
      - cache-server
    environment:
      <<: *env-redis
    volumes_from:
      - backend:ro
    networks:
      testcenter:

  backend:
    image: iqbberlin/testcenter-backend:current
    <<: *restart-policy
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
        required: false
      cache-server:
        condition: service_started
    environment:
      BROADCASTER_ENABLED: ${BROADCASTER_ENABLED}
      FILE_SERVER_ENABLED: ${FILE_SERVER_ENABLED}
      BRUTE_FORCE_PROTECTION: ${BRUTE_FORCE_PROTECTION:-}
      SERVER_KEY: ${SERVER_KEY}
      XML_SCHEMA_VALIDATION: ${XML_SCHEMA_VALIDATION:-}
      <<: [ *env-redis, *env-db ]
      # `pgbouncer` routes the backend through the optional PgBouncer service (profile `pgbouncer`).
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432
      DB_PERSISTENT_CONNECTIONS: ${DB_PERSISTENT_CONNECTIONS:-false}
      PASSWORD_SALT: ${PASSWORD_SALT}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH}
      PASSWORD_PATTERN: ${PASSWORD_PATTERN}
      REQUIRE_LOGIN_PASSWORD: ${REQUIRE_LOGIN_PASSWORD:-false}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD}
    logging:
      options:
        <<: *env-logging-conf
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://backend:8080/version" ]
      start_period: 600s
      start_interval: 5s
      interval: 90s
      timeout: 30s
      retries: 3
    volumes:
      - backend_vol:/var/www/testcenter/data
      - /var/www/testcenter/data/.schemas
    networks:
      testcenter:

  cache-server:
    image: ${DOCKERHUB_PROXY}redis:8.0-bookworm
    <<: *restart-policy
    user: redis
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD}",
      "--maxmemory", "${REDIS_MEMORY_MAX:-1gb}",
      "--maxmemory-policy", "volatile-lru",
      "--save", '""',
      "--appendonly", "no"
    ]
    networks:
      testcenter:

  db:
    image: ${DOCKERHUB_PROXY}postgres:18.4
    <<: *restart-policy
    environment:
      # POSTGRES_* is the fixed interface of the official image. DB_* remains the only public configuration.
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_vol:/var/lib/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_DATABASE}", "-h", "127.0.0.1" ]
      start_period: 120s
      start_interval: 5s
      interval: 90s
      timeout: 30s
      retries: 3
    networks:
      testcenter:

  # Optional connection pooler, started with the compose profile `pgbouncer` and used by the backend when
  # DB_HOST=pgbouncer. Transaction pooling: a server connection is held only for the duration of one transaction.
  pgbouncer:
    image: ${DOCKERHUB_PROXY}edoburu/pgbouncer:v1.25.2-p0
    profiles: [ pgbouncer ]
    <<: *restart-policy
    depends_on:
      db:
        condition: service_healthy
    environment:
      # read by the image's entrypoint, which generates pgbouncer.ini and the auth file from them
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      LISTEN_PORT: 5432
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      # clients: one connection per backend worker process
      MAX_CLIENT_CONN: 1000
      # server connections to PostgreSQL, well below its max_connections
      DEFAULT_POOL_SIZE: 50
      MAX_DB_CONNECTIONS: 80
      # a waiting client is a blocked backend worker: fail after 10 s instead of queueing
      QUERY_WAIT_TIMEOUT: 10
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
    # every client connection is a file descriptor; the default soft limit of 1024 would cap the clients
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: [ "CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "${DB_USER}", "-d", "${DB_DATABASE}" ]
      start_period: 30s
      start_interval: 2s
      interval: 90s
      timeout: 30s
      retries: 3
    networks:
      testcenter:

volumes:
  postgres_vol:
  backend_vol:

networks:
  testcenter:
    name: ${COMPOSE_PROJECT_NAME}
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: ${DOCKER_DAEMON_MTU:-1500}
