{{- if .Values.ingress.traefikEnabled }}

# Broadcaster
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-broadcaster-ingress
  namespace: tc
spec:
  entryPoints:
    {{- if .Values.ingress.tlsEnabled }}
    - websecure
    {{- else }}
    - web
    {{- end }}
  routes:
    - kind: Rule
      match: (Host(`www.{{ .Values.ingress.baseDomain }}`) || Host(`{{ .Values.ingress.baseDomain }}`)) && Path(`/bs/public/ws`)
      middlewares:
        - name: security-headers
        - name: stripregex-bs
        {{- if .Values.ingress.tlsEnabled }}
        - name: https-redirect
        {{- end }}
      services:
        - kind: Service
          name: broadcaster # !!! hard coded in application as internal address !!!
          port: 3000
  {{- if .Values.ingress.tlsEnabled }}
  tls:
    certResolver: {{ .Values.ingress.tlsCertResolver }}
  {{- end }}
---
{{- if .Values.ingress.apiDirectToBackend }}

# Backend: /api straight to the backend instead of through the frontend's nginx. stripPrefix removes /api and sets
# X-Forwarded-Prefix: /api, from which the backend builds its own public URLs.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-backend-ingress
  namespace: tc
spec:
  entryPoints:
    {{- if .Values.ingress.tlsEnabled }}
    - websecure
    {{- else }}
    - web
    {{- end }}
  routes:
    - kind: Rule
      match: (Host(`www.{{ .Values.ingress.baseDomain }}`) || Host(`{{ .Values.ingress.baseDomain }}`)) && PathPrefix(`/api/`)
      middlewares:
        - name: security-headers
        - name: stripregex-be
        {{- if .Values.ingress.tlsEnabled }}
        - name: https-redirect
        {{- end }}
      services:
        - kind: Service
          name: backend # !!! hard coded in application as internal address !!!
          port: 8080
  {{- if .Values.ingress.tlsEnabled }}
  tls:
    certResolver: {{ .Values.ingress.tlsCertResolver }}
  {{- end }}
---
{{- end }}

# Frontend
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-frontend-ingress
  namespace: tc
spec:
  entryPoints:
    {{- if .Values.ingress.tlsEnabled }}
    - websecure
    {{- else }}
    - web
    {{- end }}
  routes:
    - kind: Rule
      match: Host(`www.{{ .Values.ingress.baseDomain }}`) || Host(`{{ .Values.ingress.baseDomain }}`)
      middlewares:
        - name: security-headers
        - name: stripregex-fe
        {{- if .Values.ingress.tlsEnabled }}
        - name: https-redirect
        {{- end }}
      services:
        - kind: Service
          name: {{ .Release.Name }}-frontend-service
          port: 8080
  {{- if .Values.ingress.tlsEnabled }}
  tls:
    certResolver: {{ .Values.ingress.tlsCertResolver }}
    domains:
      - main: {{ .Values.ingress.baseDomain }}
        sans:
          - www.{{ .Values.ingress.baseDomain }}
  {{- end }}

{{- end }}
