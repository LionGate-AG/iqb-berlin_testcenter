{{- /* effective minimum replicas: HPA minReplicas when autoscaling, else the static replica count */ -}}
{{- $minReplicas := .Values.deployment.broadcaster.replicas | int -}}
{{- if .Values.deployment.broadcaster.autoscaling.enabled -}}
{{- $minReplicas = .Values.deployment.broadcaster.autoscaling.minReplicas | int -}}
{{- end -}}
{{- if gt $minReplicas 1 }}
# Only with 2+ pods: a PDB of minAvailable:1 with a single replica would block all voluntary evictions
# (node drains).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-broadcaster-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-broadcaster-pod
{{- end }}
