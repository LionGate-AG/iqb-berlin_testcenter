apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-db
spec:
  replicas: 1
  # A second pod cannot safely share the ReadWriteOnce database volume during a rolling update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-db-pod
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/db/secret.yaml") . | sha256sum }}
        {{- if .Values.postgresExporter.enabled }}
        # Picked up by the chart's Prometheus (templates/prometheus/configmap.yaml).
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
        {{- end }}
      labels:
        app: {{ .Release.Name }}-db-pod
    spec:
      {{- if .Values.deployment.db.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- .Values.deployment.db.topologySpreadConstraints | toYaml | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Release.Name }}-db-container
          image: "{{ .Values.image.db.registryPath }}postgres:{{ .Values.image.db.tag }}"
          imagePullPolicy: {{ .Values.image.db.imagePullPolicy }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- if .Values.deployment.db.resources }}
          resources:
            {{- .Values.deployment.db.resources | toYaml | nindent 12 }}
          {{- end }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.config.db.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: DB_PASSWORD
          args: [ "postgres", "-c", "max_connections=500" ]
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: db-volume
              mountPath: /var/lib/postgresql
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'pg_isready --host=127.0.0.1 --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"'
            initialDelaySeconds: {{ .Values.deployment.db.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.deployment.db.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.deployment.db.probes.liveness.timeoutSeconds }}
            successThreshold: {{ .Values.deployment.db.probes.liveness.successThreshold }}
            failureThreshold: {{ .Values.deployment.db.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'pg_isready --host=127.0.0.1 --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"'
            periodSeconds: {{ .Values.deployment.db.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.deployment.db.probes.readiness.timeoutSeconds }}
            successThreshold: {{ .Values.deployment.db.probes.readiness.successThreshold }}
            failureThreshold: {{ .Values.deployment.db.probes.readiness.failureThreshold }}
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - 'pg_isready --host=127.0.0.1 --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"'
            periodSeconds: {{ .Values.deployment.db.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.deployment.db.probes.startup.timeoutSeconds }}
            successThreshold: {{ .Values.deployment.db.probes.startup.successThreshold }}
            failureThreshold: {{ .Values.deployment.db.probes.startup.failureThreshold }}
        {{- if .Values.postgresExporter.enabled }}
        # Serves PostgreSQL statistics (connections by state, transactions, locks, cache hits, ...)
        # on :9187/metrics. Connects over localhost as the database owner, which the image creates
        # as a superuser, so every pg_stat_* view is readable.
        - name: {{ .Release.Name }}-postgres-exporter
          image: "{{ .Values.postgresExporter.image.repository }}:{{ .Values.postgresExporter.image.tag }}"
          imagePullPolicy: {{ .Values.postgresExporter.image.pullPolicy }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: DATA_SOURCE_URI
              value: "127.0.0.1:5432/{{ .Values.config.db.database }}?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: DB_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-secret
                  key: DB_PASSWORD
          ports:
            - name: metrics
              containerPort: 9187
          {{- with .Values.postgresExporter.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # No readiness probe: a sidecar that is not ready would take the database pod out of
          # its Service. A failing exporter is only restarted.
          livenessProbe:
            httpGet:
              path: /
              port: 9187
            initialDelaySeconds: 30
            periodSeconds: 15
        {{- end }}
      volumes:
        - name: db-volume
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-db-pvc
