apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  annotations:
    # The frontend readiness probe hits /api (proxied to the backend), so it can only become
    # ready once the backend is up. Start it after the backend (wave 2) to avoid blocking the
    # earlier waves: db (0) -> seed job (1) -> backend (2) -> frontend (3).
    argocd.argoproj.io/sync-wave: "3"
spec:
  {{- if not .Values.deployment.frontend.autoscaling.enabled }}
  # Omitted when the HPA manages the replica count, so upgrades do not reset it.
  replicas: {{ .Values.deployment.frontend.replicas }}
  {{- end }}
  {{- if .Values.deployment.frontend.strategy }}
  strategy:
    {{- .Values.deployment.frontend.strategy | toYaml | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend-pod
  template:
    metadata:
      {{- if .Values.nginxExporter.enabled }}
      annotations:
        # Picked up by the chart's Prometheus (templates/prometheus/configmap.yaml).
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.nginxExporter.port | quote }}
        prometheus.io/path: "/metrics"
      {{- end }}
      labels:
        app: {{ .Release.Name }}-frontend-pod
    spec:
      {{- if .Values.deployment.frontend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- .Values.deployment.frontend.topologySpreadConstraints | toYaml | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 3000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Release.Name }}-frontend-container
          image: "{{ .Values.image.frontend.registryPath }}iqbberlin/testcenter-frontend:{{ .Values.image.frontend.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.frontend.imagePullPolicy }}
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            # Allowlisted in the CSP (connect/img/media/frame/font-src) so the
            # browser may follow presigned-URL redirects to the object store.
            # Always set (empty when object store is disabled): the frontend nginx
            # template references ${OBJECT_STORE_CSP_ORIGIN} unconditionally, so an
            # undefined env var leaves a literal placeholder and nginx fails to start.
            - name: OBJECT_STORE_CSP_ORIGIN
              value: {{ if .Values.objectStore.enabled }}{{ .Values.objectStore.publicEndpoint | quote }}{{ else }}""{{ end }}
          ports:
            - name: http-container
              containerPort: 8080
          {{- if .Values.deployment.frontend.resources }}
          resources:
            {{- .Values.deployment.frontend.resources | toYaml | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: {{ .Values.deployment.frontend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.deployment.frontend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.deployment.frontend.probes.liveness.timeoutSeconds }}
            successThreshold: {{ .Values.deployment.frontend.probes.liveness.successThreshold }}
            failureThreshold: {{ .Values.deployment.frontend.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /api
              port: 8080
            periodSeconds: {{ .Values.deployment.frontend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.deployment.frontend.probes.readiness.timeoutSeconds }}
            successThreshold: {{ .Values.deployment.frontend.probes.readiness.successThreshold }}
            failureThreshold: {{ .Values.deployment.frontend.probes.readiness.failureThreshold }}
        {{- if .Values.nginxExporter.enabled }}
        # Turns nginx's stub_status into connection metrics. /nginx_status (frontend/nginx.conf)
        # answers only requests from 127.0.0.1, i.e. from containers in this pod.
        - name: {{ .Release.Name }}-nginx-exporter
          image: "{{ .Values.nginxExporter.image.repository }}:{{ .Values.nginxExporter.image.tag }}"
          imagePullPolicy: {{ .Values.nginxExporter.image.pullPolicy }}
          args:
            - --nginx.scrape-uri=http://127.0.0.1:8080/nginx_status
            - --web.listen-address=:{{ .Values.nginxExporter.port }}
          ports:
            - name: nginx-metrics
              containerPort: {{ .Values.nginxExporter.port }}
          {{- with .Values.nginxExporter.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        {{- end }}
