{{- if .Values.prometheusAdapter.enabled }}
# Cluster-scoped and not per release: only one server in the whole cluster can serve
# external.metrics.k8s.io. Installing this replaces any existing registration (for example
# KEDA's or another prometheus-adapter's).
#
# insecureSkipTLSVerify: the adapter creates a self-signed serving certificate at startup
# (--cert-dir), as metrics-server does.
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.external.metrics.k8s.io
spec:
  service:
    name: {{ .Release.Name }}-prometheus-adapter
    namespace: {{ .Release.Namespace }}
  group: external.metrics.k8s.io
  version: v1beta1
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
{{- end }}
