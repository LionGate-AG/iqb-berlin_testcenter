{{- if .Values.config.pgbouncer.enabled }}
# PgBouncer's auth_file with the database credentials (secret.db). With auth_type scram-sha-256, PgBouncer uses the
# plain-text password both to verify clients and to log in to PostgreSQL. Double quotes inside a value are doubled.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-pgbouncer-secret
type: Opaque
stringData:
  userlist.txt: |
    "{{ .Values.secret.db.user | replace "\"" "\"\"" }}" "{{ .Values.secret.db.password | replace "\"" "\"\"" }}"
{{- end }}
