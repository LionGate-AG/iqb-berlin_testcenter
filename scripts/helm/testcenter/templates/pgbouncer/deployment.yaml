{{- if .Values.config.pgbouncer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pgbouncer
spec:
  replicas: {{ .Values.deployment.pgbouncer.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-pgbouncer-pod
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/pgbouncer/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/pgbouncer/secret.yaml") . | sha256sum }}
      labels:
        app: {{ .Release.Name }}-pgbouncer-pod
    spec:
      {{- if .Values.deployment.pgbouncer.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- tpl (.Values.deployment.pgbouncer.topologySpreadConstraints | toYaml) . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # the postgres user of the image
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Release.Name }}-pgbouncer-container
          image: "{{ .Values.image.pgbouncer.registryPath }}edoburu/pgbouncer:{{ .Values.image.pgbouncer.tag }}"
          imagePullPolicy: {{ .Values.image.pgbouncer.imagePullPolicy }}
          # Runs PgBouncer directly on the mounted configuration; the image's entrypoint would generate one from
          # environment variables instead. Every client connection is a file descriptor, and containers often start
          # with a soft limit of 1024 open files, which would cap PgBouncer at about 1000 clients regardless of
          # max_client_conn. So the soft limit is raised to the hard limit first.
          command: [ "sh", "-c", "ulimit -n \"$(ulimit -Hn)\" && exec /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini" ]
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgres
              containerPort: 5432
          {{- if .Values.deployment.pgbouncer.resources }}
          resources:
            {{- .Values.deployment.pgbouncer.resources | toYaml | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
              readOnly: true
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: {{ .Release.Name }}-pgbouncer-config
              - secret:
                  name: {{ .Release.Name }}-pgbouncer-secret
{{- end }}
